{{- range $a := include "registry.serviceAccounts" . | fromJsonArray }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "registry.serviceAccountSecret" (dict "root" $ "name" $a.name) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "registry.labels" $ | nindent 4 }}
    app.kubernetes.io/component: service-account
  annotations:
    # Generated once and kept: deleting the Secret and upgrading rotates the key.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  token: {{ include "registry.serviceAccountKey" (dict "root" $ "name" $a.name) | quote }}
{{- end }}
