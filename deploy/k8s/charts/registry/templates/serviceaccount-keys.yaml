{{- range $a := include "registry.serviceAccounts" . | fromJsonArray }}
{{- /* One key per account, written to every Secret that carries it. */}}
{{- $key := include "registry.serviceAccountKey" (dict "root" $ "name" $a.name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "registry.serviceAccountSecret" (dict "root" $ "name" $a.name) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "registry.labels" $ | nindent 4 }}
    app.kubernetes.io/component: service-account
  annotations:
    # Generated once and kept: deleting the Secret and upgrading rotates the key.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  token: {{ $key | quote }}
{{- if $a.secretNamespace }}
---
# The same key for the account's user, in its own namespace.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "registry.serviceAccountSecret" (dict "root" $ "name" $a.name) }}
  namespace: {{ $a.secretNamespace }}
  labels:
    {{- include "registry.labels" $ | nindent 4 }}
    app.kubernetes.io/component: service-account
type: Opaque
stringData:
  token: {{ $key | quote }}
{{- end }}
{{- end }}
