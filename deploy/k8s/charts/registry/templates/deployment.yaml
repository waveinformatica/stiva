apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "registry.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "registry.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "registry.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Pods do not restart when a Secret or ConfigMap they consume changes:
        # Kubernetes only rolls a Deployment when the pod template itself does.
        # Hashing the rendered contents into an annotation makes a configuration
        # change roll the pods, which is what an operator expects when they edit
        # a value and run an upgrade.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        # The service-account keys are read at startup: a rotated key restarts
        # the registry.
        checksum/service-accounts: {{ include (print $.Template.BasePath "/serviceaccount-keys.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "registry.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: registry
          image: {{ include "registry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "registry.fullname" . }}-config
            - secretRef:
                name: {{ include "registry.fullname" . }}-secrets
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            # Declared service accounts, provisioned at every start from the
            # keys mounted below (an empty list removes earlier ones).
            - name: REGISTRY_SERVICE_ACCOUNTS
              value: {{ $sa := list }}{{ range $a := include "registry.serviceAccounts" . | fromJsonArray }}{{ $sa = append $sa (dict "name" $a.name "role" $a.role "scope" $a.scope "key_file" (printf "/etc/stiva/service-accounts/%s/token" $a.name)) }}{{ end }}{{ toJson $sa | quote }}
          # /data is always mounted: even with an object-store blob backend the
          # registry stages in-progress uploads on local disk, and the image
          # runs as a non-root user that cannot create /data itself.
          volumeMounts:
            - name: blobs
              mountPath: /data
            {{- range $a := include "registry.serviceAccounts" . | fromJsonArray }}
            - name: key-{{ $a.name }}
              mountPath: /etc/stiva/service-accounts/{{ $a.name }}
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        {{- range $a := include "registry.serviceAccounts" . | fromJsonArray }}
        - name: key-{{ $a.name }}
          secret:
            secretName: {{ include "registry.serviceAccountSecret" (dict "root" $ "name" $a.name) }}
        {{- end }}
        - name: blobs
        {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "registry.fullname" . }}-blobs
        {{- else }}
          # Upload staging only; blobs live in the object store.
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
