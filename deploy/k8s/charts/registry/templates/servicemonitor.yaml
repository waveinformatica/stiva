{{- if .Values.metrics.serviceMonitor.enabled }}
{{- if not .Values.scanner.enabled }}{{ fail "metrics.serviceMonitor authenticates with the stiva-scanner account: enable the scanner" }}{{ end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "registry.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "registry.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: registry
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "registry.serviceAccountSecret" (dict "root" . "name" "stiva-scanner") }}
          key: token
{{- end }}
