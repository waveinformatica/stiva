{{- if .Values.warmer.enabled }}
{{- $fullname := include "registry.fullname" . }}
{{- $name := printf "%s-warmer" $fullname }}
{{- $w := .Values.warmer }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
---
# The agent lists the pods of its own node, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
    app.kubernetes.io/component: warmer
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  # The agent serves nothing: update every node at once, so a node that is
  # down (its pod stuck) does not hold the others back.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 100%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/component: warmer
    spec:
      serviceAccountName: {{ $name }}
      {{- with $w.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Every node runs images worth caching, tainted nodes included.
      tolerations:
        - operator: Exists
      containers:
        - name: warmer
          image: {{ include "registry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/registry-warmer"]
          args:
            - -interval={{ $w.interval }}
          env:
            - name: REGISTRY_WARMER_REGISTRY
              value: {{ .Values.cache.registry | quote }}
            - name: REGISTRY_WARMER_CACHE_URL
              value: {{ printf "http://%s:%v" $fullname .Values.cache.port | quote }}
            - name: REGISTRY_WARMER_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: REGISTRY_WARMER_CONTENT_DIR
              value: /containerd/content
            - name: REGISTRY_WARMER_EXCLUDE
              value: {{ join "," $w.excludeRegistries | quote }}
            - name: REGISTRY_WARMER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "registry.serviceAccountSecret" (dict "root" . "name" "stiva-warmer") }}
                  key: token
          # The content store is world-readable below its own directory
          # (blobs 0444): no privilege is needed to read it.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: content
              mountPath: /containerd/content
              readOnly: true
          resources:
            {{- toYaml $w.resources | nindent 12 }}
      volumes:
        - name: content
          hostPath:
            path: {{ $w.containerdContentDir }}
            type: Directory
{{- end }}
