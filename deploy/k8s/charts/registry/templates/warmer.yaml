{{- if .Values.warmer.enabled }}
{{- $fullname := include "registry.fullname" . }}
{{- $sa := printf "%s-warmer" $fullname }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $sa }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sa }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $sa }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.warmer.token | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
    app.kubernetes.io/component: warmer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $sa }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $sa }}
    spec:
      serviceAccountName: {{ $sa }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: warmer
          image: {{ include "registry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/registry-warmer"]
          env:
            - name: REGISTRY_WARMER_CACHE_URL
              value: {{ default (printf "http://%s:%s" $fullname (toString $.Values.service.port)) .Values.warmer.cacheUrl | quote }}
            - name: REGISTRY_WARMER_NAME
              value: {{ .Values.warmer.registry | quote }}
            - name: REGISTRY_WARMER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $sa }}
                  key: token
            - name: REGISTRY_WARMER_INTERVAL
              value: {{ .Values.warmer.interval | quote }}
          resources:
            {{- toYaml .Values.warmer.resources | nindent 12 }}
{{- end }}
