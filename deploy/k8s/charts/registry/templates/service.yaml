apiVersion: v1
kind: Service
metadata:
  name: {{ include "registry.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: registry
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
    {{- if or .Values.cacheMirror.enabled .Values.warmer.enabled }}
    # The cache registry's own listener: the nodes' mirror, the warm pushes.
    - name: cache
      port: {{ .Values.cache.port }}
      targetPort: {{ .Values.cache.port }}
      protocol: TCP
    {{- end }}
  selector:
    {{- include "registry.selectorLabels" . | nindent 4 }}
