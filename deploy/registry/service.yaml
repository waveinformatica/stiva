apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
  labels:
    app.kubernetes.io/name: registry
spec:
  type: ClusterIP
  # Expose on the standard registry port 5000 inside the cluster. Pods reference
  # images as registry.registry.svc.cluster.local:5000/<repo>:<tag>.
  ports:
    - name: registry
      port: 5000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: registry
