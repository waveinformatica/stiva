apiVersion: v1
kind: Secret
metadata:
  name: registry-secrets
  namespace: registry
type: Opaque
stringData:
  # PostgreSQL connection string for the metadata store. This is the ONLY value
  # that cannot be configured from the UI; it is startup-only by design.
  REGISTRY_POSTGRES: "postgres://registry:CHANGE_ME@postgres.registry.svc.cluster.local:5432/registry?sslmode=disable"

  # Bootstrap admin account (local realm). The first admin is created on startup
  # if it does not yet exist; all further user management is done from the UI.
  REGISTRY_ADMIN_USER: "admin"
  REGISTRY_ADMIN_PASS: "CHANGE_ME"

  # HMAC secret for session tokens. If left empty the server generates an
  # ephemeral one at startup and logs a warning.
  #
  # REQUIRED as soon as replicas > 1: each pod would otherwise generate its own
  # secret, so a token issued by one pod is rejected by the others and clients
  # see intermittent 401s that load-balance at random — a failure that is very
  # hard to diagnose from the symptoms. It is also what keeps sessions alive
  # across a restart or a rollout.
  #
  # Generate with:  openssl rand -hex 32
  REGISTRY_AUTH_SECRET: ""
